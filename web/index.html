<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GridSwing</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root { color-scheme: light dark; --bg:#0b0f14; --panel:#121821; --border:#243040; --text:#e6edf3;
          --muted:#8b98a5; --accent:#4f9dff; --good:#3fb950; --bad:#f85149; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f8fa; --panel:#fff; --border:#d0d7de; --text:#1f2328; --muted:#57606a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:1000px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:20px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; }
  form { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px;
                  padding:7px 8px; font-size:13px; }
  .actions { grid-column:1/-1; display:flex; gap:10px; align-items:center; margin-top:4px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:9px 18px;
           font-size:13px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--border); }
  th:first-child, td:first-child { text-align:left; }
  .pos { color:var(--good); } .neg { color:var(--bad); }
  canvas { max-height:280px; }
  h3 { margin:0 0 10px; font-size:14px; }
  #error { color:var(--bad); font-size:13px; display:none; }
  .panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .panel-header h3 { margin:0; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; }
  .btn-sm { padding:5px 10px; font-size:12px; font-weight:500; }
  .btn-secondary { background:var(--border); color:var(--text); }
  .analysis-result { margin-top:12px; font-size:13px; white-space:pre-wrap; }
  .analysis-result table { margin-top:0; }
  #verdict { white-space:pre-wrap; margin-top:12px; color:var(--text); font-size:13px; }
  .filter-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1>GridSwing</h1>
  <p>Grid / DCA ETF backtester — run a config, compare against buy-and-hold, gross vs post-tax.</p>
</header>
<main>
  <div class="panel">
    <form id="run-form">
      <label>Symbol <input name="symbol" value="GOLDBEES.NS" required></label>
      <label>Start <input name="start" type="date" value="2022-01-01" required></label>
      <label>End (optional) <input name="end" type="date"></label>
      <label>Capital (₹) <input name="capital" type="number" value="100000" required></label>
      <label>Step % <input name="step" type="number" step="0.1" value="1.0"></label>
      <label>Target % <input name="target" type="number" step="0.1" value="1.0"></label>
      <label>Lot size (₹) <input name="lot_size" type="number" value="10000"></label>
      <label>Mode
        <select name="mode"><option value="classic">classic</option><option value="dynamic">dynamic</option></select>
      </label>
      <label>Max deploy % <input name="max_deploy" type="number" value="100"></label>
      <label>Idle yield % <input name="idle_yield" type="number" step="0.1" value="0"></label>
      <label>Anchor
        <select name="anchor_mode"><option value="first_close">first_close</option><option value="trailing">trailing</option></select>
      </label>
      <label>Fills
        <select name="fills"><option value="intraday">intraday</option><option value="close">close</option></select>
      </label>
      <label>Slippage % <input name="slippage" type="number" step="0.01" value="0.1"></label>
      <label>Fill buffer <input name="fill_buffer" type="number" step="0.0001" value="0.0005"></label>
      <label>Brokerage % <input name="brokerage" type="number" step="0.01" value="0"></label>
      <label>STCG rate % <input name="stcg_rate" type="number" value="30"></label>
      <label>LTCG rate % <input name="ltcg_rate" type="number" step="0.1" value="12.5"></label>
      <div class="actions">
        <button type="submit" id="submit-btn">Run backtest</button>
        <span id="status"></span>
      </div>
    </form>
    <p id="error"></p>
  </div>

  <div class="panel">
    <h3>Analysis</h3>
    <div class="actions">
      <button type="button" id="sweep-btn">Run parameter sweep</button>
      <button type="button" id="walkforward-btn">Run walk-forward</button>
      <button type="button" id="blend-btn">Run 50/50 blend</button>
    </div>
    <div id="sweep-result" class="analysis-result"></div>
    <div id="walkforward-result" class="analysis-result"></div>
    <div id="blend-result" class="analysis-result"></div>
  </div>

  <div class="panel" id="summary-panel" hidden>
    <h3>Portfolio Summary</h3>
    <table id="summary-table"></table>
  </div>

  <div class="panel" id="results" hidden>
    <h3>Grid vs Buy &amp; Hold</h3>
    <table id="metrics-table"></table>
    <p id="verdict"></p>
  </div>

  <div class="panel" id="equity-panel" hidden>
    <h3>Equity Curve</h3>
    <canvas id="equity-chart"></canvas>
  </div>

  <div class="panel" id="drawdown-panel" hidden>
    <h3>Drawdown %</h3>
    <canvas id="drawdown-chart"></canvas>
  </div>

  <div class="panel" id="filter-panel" hidden>
    <h3>Filter by buy date</h3>
    <div class="filter-row">
      <label>From <input type="date" id="filter-from"></label>
      <label>To <input type="date" id="filter-to"></label>
      <button type="button" id="filter-apply" class="btn-sm">Apply</button>
      <button type="button" id="filter-reset" class="btn-sm btn-secondary">Reset</button>
    </div>
  </div>

  <div class="panel" id="trades-panel" hidden>
    <div class="panel-header">
      <h3>Trades</h3>
      <div class="btn-row">
        <button type="button" class="btn-sm dl-btn" data-target="trades" data-format="csv">Download CSV</button>
        <button type="button" class="btn-sm dl-btn" data-target="trades" data-format="xlsx">Download XLSX</button>
      </div>
    </div>
    <table id="trades-table"></table>
  </div>

  <div class="panel" id="monthly-panel" hidden>
    <div class="panel-header">
      <h3>Monthly Activity</h3>
      <div class="btn-row">
        <button type="button" class="btn-sm dl-btn" data-target="monthly" data-format="csv">Download CSV</button>
        <button type="button" class="btn-sm dl-btn" data-target="monthly" data-format="xlsx">Download XLSX</button>
      </div>
    </div>
    <table id="monthly-table"></table>
    <canvas id="monthly-chart"></canvas>
  </div>

  <div class="panel" id="ledger-panel" hidden>
    <div class="panel-header">
      <h3>Daily Activity Ledger</h3>
      <div class="btn-row">
        <button type="button" id="ledger-toggle" class="btn-sm btn-secondary">Show daily ledger</button>
        <button type="button" class="btn-sm dl-btn" data-target="ledger" data-format="csv">Download CSV</button>
        <button type="button" class="btn-sm dl-btn" data-target="ledger" data-format="xlsx">Download XLSX</button>
      </div>
    </div>
    <div id="ledger-table-wrap" hidden>
      <table id="ledger-table"></table>
    </div>
  </div>
</main>

<script>
// Set at deploy time to the live Render API URL.
const API_BASE = window.GRIDSWING_API_BASE || "https://gridswing-api.onrender.com";

const form = document.getElementById("run-form");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const submitBtn = document.getElementById("submit-btn");
let equityChart, drawdownChart, monthlyChart;
let lastSymbol = "";         // symbol of the last run, used to prefix downloaded filenames
let lastTrades = [];         // full, unfiltered trades from the last run
let currentTrades = [];      // whatever's currently rendered in the trades table (post-filter)
let currentMonthlyRows = []; // whatever's currently rendered in the monthly pivot (post-filter)
let lastDailyLedger = [];    // full, unfiltered daily ledger from the last run
let currentLedgerRows = [];  // whatever's currently rendered in the ledger table (post-filter)

const METRIC_ROWS = [
  ["Absolute return %", "absolute_return_pct"],
  ["CAGR %", "cagr_pct"],
  ["Post-tax abs. return %", "post_tax_absolute_return_pct"],
  ["Post-tax CAGR %", "post_tax_cagr_pct"],
];

function fmt(n) { return typeof n === "number" ? n.toFixed(2) : "—"; }

function currentBody() {
  const fd = new FormData(form);
  return {
    symbol: fd.get("symbol"), start: fd.get("start"), end: fd.get("end") || null,
    capital: Number(fd.get("capital")), step: Number(fd.get("step")), target: Number(fd.get("target")),
    lot_size: Number(fd.get("lot_size")), mode: fd.get("mode"), max_deploy: Number(fd.get("max_deploy")),
    idle_yield: Number(fd.get("idle_yield")), anchor_mode: fd.get("anchor_mode"),
    brokerage: Number(fd.get("brokerage")), stcg_rate: Number(fd.get("stcg_rate")),
    ltcg_rate: Number(fd.get("ltcg_rate")), fills: fd.get("fills"),
    slippage: Number(fd.get("slippage")), fill_buffer: Number(fd.get("fill_buffer")),
  };
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  submitBtn.disabled = true;
  statusEl.textContent = "Running backtest…";

  const body = currentBody();

  try {
    const runResp = await fetch(`${API_BASE}/run`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (!runResp.ok) throw new Error((await runResp.json()).detail || `HTTP ${runResp.status}`);
    const { run_id, metrics, benchmark, verdict, daily_ledger } = await runResp.json();

    statusEl.textContent = "Loading results…";
    const detailResp = await fetch(`${API_BASE}/runs/${run_id}`);
    if (!detailResp.ok) throw new Error(`HTTP ${detailResp.status}`);
    const detail = await detailResp.json();

    renderMetrics(metrics, benchmark);
    document.getElementById("verdict").textContent = verdict || "";

    lastSymbol = body.symbol;
    lastTrades = detail.trades;
    document.getElementById("filter-from").value = "";
    document.getElementById("filter-to").value = "";
    document.getElementById("filter-panel").hidden = lastTrades.length === 0;
    renderTrades(lastTrades);
    renderMonthly(lastTrades);
    renderCharts(detail.equity_curve);

    lastDailyLedger = daily_ledger || [];
    renderLedger(lastDailyLedger);
    renderSummary(lastDailyLedger[lastDailyLedger.length - 1], body.capital);

    statusEl.textContent = `Run ${run_id.slice(0, 8)} complete.`;
  } catch (err) {
    errorEl.textContent = err.message || String(err);
    errorEl.style.display = "block";
    statusEl.textContent = "";
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById("filter-apply").addEventListener("click", () => {
  const from = document.getElementById("filter-from").value;
  const to = document.getElementById("filter-to").value;
  const filtered = lastTrades.filter(t => (!from || t.buy_date >= from) && (!to || t.buy_date <= to));
  renderTrades(filtered);
  renderMonthly(filtered);
  const ledgerFiltered = lastDailyLedger.filter(r => (!from || r.date >= from) && (!to || r.date <= to));
  renderLedger(ledgerFiltered);
});

document.getElementById("filter-reset").addEventListener("click", () => {
  document.getElementById("filter-from").value = "";
  document.getElementById("filter-to").value = "";
  renderTrades(lastTrades);
  renderMonthly(lastTrades);
  renderLedger(lastDailyLedger);
});

function renderMetrics(m, bh) {
  const table = document.getElementById("metrics-table");
  table.innerHTML = "<tr><th>Metric</th><th>Grid</th><th>Buy&Hold</th></tr>" +
    METRIC_ROWS.map(([label, key]) => `<tr><td>${label}</td><td>${fmt(m[key])}</td><td>${fmt(bh[key])}</td></tr>`).join("") +
    `<tr><td>Trades</td><td colspan="2">${m.num_round_trip_trades} (win rate ${fmt(m.win_rate_pct)}%)</td></tr>` +
    `<tr><td>Max drawdown %</td><td colspan="2">${fmt(m.max_drawdown_pct)}</td></tr>` +
    `<tr><td>Total tax</td><td colspan="2">₹${fmt(m.total_tax)} (STCG ₹${fmt(m.stcg_tax)} / LTCG ₹${fmt(m.ltcg_tax)})</td></tr>`;
  document.getElementById("results").hidden = false;
}

function renderTrades(trades) {
  const table = document.getElementById("trades-table");
  const panel = document.getElementById("trades-panel");
  currentTrades = trades;
  if (!trades.length) { panel.hidden = true; return; }
  table.innerHTML = "<tr><th>Buy</th><th>Sell</th><th>Qty</th><th>Buy px</th><th>Sell px</th><th>PnL</th><th>Class</th></tr>" +
    trades.map(t => `<tr><td>${t.buy_date}</td><td>${t.sell_date}</td><td>${fmt(+t.qty)}</td>` +
      `<td>${fmt(+t.buy_price)}</td><td>${fmt(+t.sell_price)}</td>` +
      `<td class="${+t.gross_pnl >= 0 ? 'pos' : 'neg'}">${fmt(+t.gross_pnl)}</td><td>${t.tax_class}</td></tr>`).join("");
  panel.hidden = false;
}

function renderMonthly(trades) {
  const panel = document.getElementById("monthly-panel");
  if (!trades.length) { panel.hidden = true; currentMonthlyRows = []; return; }

  // Group by calendar month of buy_date. Idle days = gap between the previous
  // trade's sell_date and this trade's buy_date, walked in buy_date order.
  // Grid trades can overlap, so this is a directional simplification, not an
  // exact "time since last exit".
  const sorted = [...trades].sort((a, b) => a.buy_date.localeCompare(b.buy_date));
  const monthOf = d => d.slice(0, 7);
  const dayDiff = (from, to) => (new Date(to) - new Date(from)) / 86400000;
  const months = {}; // "YYYY-MM" -> { buys, sells, idleSum, idleCount }
  const bucket = m => (months[m] ??= { buys: 0, sells: 0, idleSum: 0, idleCount: 0 });

  let prevSellDate = null;
  for (const t of sorted) {
    const b = bucket(monthOf(t.buy_date));
    b.buys++;
    if (prevSellDate) {
      b.idleSum += Math.max(0, dayDiff(prevSellDate, t.buy_date));
      b.idleCount++;
    }
    prevSellDate = t.sell_date;
  }
  for (const t of sorted) {
    if (t.sell_date) bucket(monthOf(t.sell_date)).sells++;
  }

  const monthKeys = Object.keys(months).sort();
  currentMonthlyRows = monthKeys.map(m => {
    const r = months[m];
    return { month: m, buys: r.buys, sells: r.sells,
             avgIdle: r.idleCount ? r.idleSum / r.idleCount : 0, totalIdle: r.idleSum };
  });
  const table = document.getElementById("monthly-table");
  table.innerHTML = "<tr><th>Month</th><th>Buys</th><th>Sells</th><th>Avg idle days</th><th>Total idle days</th></tr>" +
    currentMonthlyRows.map(r =>
      `<tr><td>${r.month}</td><td>${r.buys}</td><td>${r.sells}</td><td>${fmt(r.avgIdle)}</td><td>${fmt(r.totalIdle)}</td></tr>`
    ).join("");

  panel.hidden = false;
  monthlyChart?.destroy();
  monthlyChart = new Chart(document.getElementById("monthly-chart"), {
    type: "bar",
    data: { labels: monthKeys, datasets: [{
      data: monthKeys.map(m => months[m].idleCount ? months[m].idleSum / months[m].idleCount : 0),
      backgroundColor: "#4f9dff",
    }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 8 } } } },
  });
}

function renderCharts(equityCurve) {
  const labels = equityCurve.map(r => r.date);
  const equity = equityCurve.map(r => +r.equity);
  let peak = -Infinity;
  const drawdown = equity.map(v => { peak = Math.max(peak, v); return ((v - peak) / peak) * 100; });

  document.getElementById("equity-panel").hidden = false;
  document.getElementById("drawdown-panel").hidden = false;

  equityChart?.destroy();
  drawdownChart?.destroy();
  equityChart = new Chart(document.getElementById("equity-chart"), {
    type: "line",
    data: { labels, datasets: [{ data: equity, borderColor: "#4f9dff", pointRadius: 0, borderWidth: 1.5 }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 8 } } } },
  });
  drawdownChart = new Chart(document.getElementById("drawdown-chart"), {
    type: "line",
    data: { labels, datasets: [{ data: drawdown, borderColor: "#f85149", pointRadius: 0, borderWidth: 1.5, fill: true, backgroundColor: "rgba(248,81,73,0.15)" }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 8 } } } },
  });
}

// ---- Daily Activity Ledger: one row per trading day, hidden behind a toggle
// since a multi-year run can be 700+ rows -- don't inject them until asked. ----

const LEDGER_COLUMNS = [
  ["date", "Date"], ["market_price", "Price"], ["anchor_after", "Anchor"], ["new_ath", "New ATH"],
  ["drawdown_pct", "DD %"], ["action", "Action"], ["buy_legs", "Buy legs"], ["sell_legs", "Sell legs"],
  ["buy_amount", "Buy ₹"], ["sell_proceeds", "Sell ₹"], ["realized_pnl_day", "Realized PnL"],
  ["realized_pnl_cum", "Profit banked"], ["open_legs", "Open legs"], ["open_principal", "Open principal"],
  ["holding_units", "Holding units"], ["holding_value", "Holding value"], ["unrealized_pnl", "Unrealized PnL"],
  ["cash", "Cash"], ["portfolio_value", "Portfolio value"], ["overall_pnl", "Overall PnL"],
  ["next_leg_trigger_price", "Next buy trigger"], ["next_leg_amount", "Next buy ₹"],
];

function ledgerCell(key, val) {
  if (key === "date" || key === "action") return val ?? "—";
  if (key === "new_ath") return val ? "Yes" : "No";
  if (val === null || val === undefined) return "—";
  return fmt(+val);
}

function renderSummary(last, capital) {
  const panel = document.getElementById("summary-panel");
  if (!last) { panel.hidden = true; return; }
  panel.hidden = false;
  const rows = [
    ["Starting capital", `₹${fmt(capital)}`],
    ["Latest ATH", `₹${fmt(last.anchor_after)}`],
    ["Latest price", `₹${fmt(last.market_price)}`],
    ["ATH drawdown", `${fmt(last.drawdown_pct)}%`],
    ["Cash principal", `₹${fmt(last.cash)}`],
    ["Open principal", `₹${fmt(last.open_principal)}`],
    ["Holding units", fmt(last.holding_units)],
    ["Holding value", `₹${fmt(last.holding_value)}`],
    ["Unrealized P&L", `₹${fmt(last.unrealized_pnl)}`],
    ["Realized P&L", `₹${fmt(last.realized_pnl_cum)}`],
    ["Portfolio value", `₹${fmt(last.portfolio_value)}`],
    ["Current P&L", `₹${fmt(last.overall_pnl)}`],
  ];
  document.getElementById("summary-table").innerHTML =
    rows.map(([label, value]) => `<tr><td>${label}</td><td>${value}</td></tr>`).join("");
}

function renderLedger(rows) {
  const panel = document.getElementById("ledger-panel");
  currentLedgerRows = rows;
  if (!rows.length) { panel.hidden = true; return; }
  panel.hidden = false;
  const table = document.getElementById("ledger-table");
  table.innerHTML = "<tr>" + LEDGER_COLUMNS.map(([, label]) => `<th>${label}</th>`).join("") + "</tr>" +
    rows.map(r => "<tr>" + LEDGER_COLUMNS.map(([key]) => {
      const cls = key === "realized_pnl_day" || key === "unrealized_pnl" || key === "overall_pnl"
        ? (+r[key] >= 0 ? "pos" : "neg") : "";
      return `<td class="${cls}">${ledgerCell(key, r[key])}</td>`;
    }).join("") + "</tr>").join("");
}

document.getElementById("ledger-toggle").addEventListener("click", () => {
  const wrap = document.getElementById("ledger-table-wrap");
  const btn = document.getElementById("ledger-toggle");
  wrap.hidden = !wrap.hidden;
  btn.textContent = wrap.hidden ? "Show daily ledger" : "Hide daily ledger";
});

// ---- Analysis panel: sweep / walk-forward / blend ----

async function runAnalysis(kind) {
  const btn = document.getElementById(`${kind}-btn`);
  const resultEl = document.getElementById(`${kind}-result`);
  btn.disabled = true;
  resultEl.textContent = "Running…";
  try {
    const resp = await fetch(`${API_BASE}/${kind}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(currentBody()),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || `HTTP ${resp.status}`);
    const data = await resp.json();
    if (kind === "sweep") renderSweepResult(data.rows, resultEl);
    else if (kind === "walkforward") renderWalkforwardResult(data, resultEl);
    else renderBlendResult(data, resultEl);
  } catch (err) {
    resultEl.textContent = err.message || String(err);
  } finally {
    btn.disabled = false;
  }
}

function renderSweepResult(rows, el) {
  const sorted = [...rows].sort((a, b) => b.post_tax_cagr_pct - a.post_tax_cagr_pct);
  el.innerHTML = "<table><tr><th>Step %</th><th>Target %</th><th>Post-tax CAGR %</th><th>Max DD %</th></tr>" +
    sorted.map(r => `<tr><td>${fmt(r.step)}</td><td>${fmt(r.target)}</td>` +
      `<td>${fmt(r.post_tax_cagr_pct)}</td><td>${fmt(r.max_drawdown_pct)}</td></tr>`).join("") +
    "</table>";
}

function renderWalkforwardResult(d, el) {
  const lines = [
    `Best params: step=${fmt(d.best_step)}% target=${fmt(d.best_target)}%`,
    `In-sample post-tax CAGR: ${fmt(d.in_sample_cagr_pct)}%`,
  ];
  if (d.out_sample_cagr_pct != null) lines.push(`Out-of-sample post-tax CAGR: ${fmt(d.out_sample_cagr_pct)}%`);
  if (d.overfitting_flag) lines.push("WARNING: out-of-sample CAGR dropped >30% vs in-sample — possible overfitting.");
  el.textContent = lines.join("\n");
}

function renderBlendResult(d, el) {
  el.textContent =
    `Combined 50/50 post-tax absolute return: ${fmt(d.combined_post_tax_absolute_return_pct)}%\n` +
    `Grid-only post-tax CAGR: ${fmt(d.grid_only_post_tax_cagr_pct)}%\n` +
    `Buy&hold-only post-tax CAGR: ${fmt(d.buy_hold_only_post_tax_cagr_pct)}%`;
}

document.getElementById("sweep-btn").addEventListener("click", () => runAnalysis("sweep"));
document.getElementById("walkforward-btn").addEventListener("click", () => runAnalysis("walkforward"));
document.getElementById("blend-btn").addEventListener("click", () => runAnalysis("blend"));

// ---- CSV / XLSX export (trades + monthly activity + daily ledger, whatever's currently displayed) ----

const TRADES_HEADERS = [
  ["buy_date", "Buy"], ["sell_date", "Sell"], ["qty", "Qty"], ["buy_price", "Buy px"],
  ["sell_price", "Sell px"], ["gross_pnl", "PnL"], ["tax_class", "Class"],
];
const MONTHLY_HEADERS = [
  ["month", "Month"], ["buys", "Buys"], ["sells", "Sells"], ["avgIdle", "Avg idle days"], ["totalIdle", "Total idle days"],
];
const DAILY_LEDGER_HEADERS = [
  ["date", "Date"], ["market_price", "Market Price"], ["anchor_before", "Anchor Before"],
  ["anchor_after", "Anchor After"], ["new_ath", "New ATH"], ["drawdown_pct", "Drawdown %"],
  ["action", "Action"], ["buy_legs", "Buy Legs"], ["sell_legs", "Sell Legs"], ["buy_amount", "Buy Amount"],
  ["sell_proceeds", "Sell Proceeds"], ["realized_pnl_day", "Realized PnL (Day)"],
  ["realized_pnl_cum", "Profit Banked"], ["open_legs", "Open Legs"], ["open_principal", "Open Principal"],
  ["holding_units", "Holding Units"], ["holding_value", "Holding Value"], ["unrealized_pnl", "Unrealized PnL"],
  ["cash", "Cash"], ["portfolio_value", "Portfolio Value"], ["overall_pnl", "Overall PnL"],
  ["next_buy_level", "Next Buy Level"], ["next_leg_trigger_price", "Next Leg Trigger Price"],
  ["next_leg_amount", "Next Leg Amount"],
];

function csvCell(v) {
  const s = v === undefined || v === null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportRows(rows, headers, filenameBase, format) {
  if (!rows.length) return;
  if (format === "csv") {
    const csv = [
      headers.map(([, label]) => csvCell(label)).join(","),
      ...rows.map(r => headers.map(([key]) => csvCell(r[key])).join(",")),
    ].join("\n");
    downloadBlob(new Blob([csv], { type: "text/csv" }), `${filenameBase}.csv`);
  } else {
    const sheetRows = rows.map(r => Object.fromEntries(headers.map(([key, label]) => [label, r[key]])));
    const ws = XLSX.utils.json_to_sheet(sheetRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
    XLSX.writeFile(wb, `${filenameBase}.xlsx`);
  }
}

document.querySelectorAll(".dl-btn").forEach(btn => btn.addEventListener("click", () => {
  const { target, format } = btn.dataset;
  const prefix = lastSymbol ? `${lastSymbol.replace(/[^A-Za-z0-9.-]/g, "_")}_` : "";
  if (target === "trades") exportRows(currentTrades, TRADES_HEADERS, `${prefix}trades`, format);
  else if (target === "monthly") exportRows(currentMonthlyRows, MONTHLY_HEADERS, `${prefix}monthly-activity`, format);
  else exportRows(currentLedgerRows, DAILY_LEDGER_HEADERS, `${prefix}daily-ledger`, format);
}));
</script>
